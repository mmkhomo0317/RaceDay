name: CI

on:
  push:            # every push, to any branch
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RaceDay.slnx

      - name: Build
        run: dotnet build RunWay.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test RunWay.slnx --no-build --configuration Release --verbosity normal
